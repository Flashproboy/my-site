<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khata Lite — Expense Tracker</title><style>
:root{font-family:Inter,system-ui,Arial;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.hero{background:linear-gradient(135deg,#0f766e,#164e63);color:white;padding:28px;border-radius:22px}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat,form,.list{background:white;border:1px solid #e3e9f2;border-radius:16px;padding:16px}.stat small{color:#64748b}.stat strong{display:block;font-size:1.45rem;margin-top:5px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}label{display:block;font-size:.88rem;margin:12px 0 5px}input,select,button{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{background:#0f766e;color:white;border:0;font-weight:700;cursor:pointer;margin-top:12px}button.secondary{background:#e2e8f0;color:#172033}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f7}.row:last-child{border:0}.muted{color:#64748b;font-size:.85rem}.amount{font-weight:750}.income{color:#15803d}.expense{color:#b91c1c}.actions{display:flex;gap:8px}.actions button{width:auto;margin:0;padding:8px 10px}@media(max-width:650px){body{padding:12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.hero{padding:22px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Khata Lite</h1><p>A small, local-first income and expense ledger. Your entries stay in this browser.</p></header><section class="stats"><div class="stat"><small>Current balance</small><strong id="balance">Rs 0</strong></div><div class="stat"><small>Total income</small><strong id="income">Rs 0</strong></div><div class="stat"><small>Total expenses</small><strong id="expense">Rs 0</strong></div></section><div class="grid"><form id="entryForm"><h2>Add transaction</h2><label for="title">Description</label><input id="title" required maxlength="80" placeholder="e.g. Groceries"><label for="amount">Amount (PKR)</label><input id="amount" type="number" min="1" step=".01" required placeholder="1200"><label for="type">Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><label for="date">Date</label><input id="date" type="date" required><button>Add transaction</button><button class="secondary" id="export" type="button">Export CSV</button><p class="muted">Demo only: data is stored with localStorage on this device.</p></form><section class="list"><h2>Transactions</h2><input id="filter" placeholder="Search transactions…"><div id="entries"></div></section></div></main><script>
const $=id=>document.getElementById(id);let items=JSON.parse(localStorage.getItem('khata-lite-items')||'[]');$('date').value=new Date().toISOString().slice(0,10);const money=n=>'Rs '+Number(n).toLocaleString('en-PK',{maximumFractionDigits:2});function save(){localStorage.setItem('khata-lite-items',JSON.stringify(items));render()}function render(){let inc=items.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=items.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);let q=$('filter').value.toLowerCase();let filtered=items.filter(x=>x.title.toLowerCase().includes(q)||x.date.includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('entries').innerHTML=filtered.length?filtered.map(x=>'<div class="row"><div><b>'+esc(x.title)+'</b><div class="muted">'+x.date+' · '+x.type+'</div></div><div class="actions"><span class="amount '+x.type+'">'+(x.type==='income'?'+':'−')+money(x.amount)+'</span><button class="secondary" data-del="'+x.id+'" aria-label="Delete '+esc(x.title)+'">×</button></div></div>').join(''):'<p class="muted">No transactions yet. Add your first entry.</p>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('entryForm').addEventListener('submit',e=>{e.preventDefault();items.push({id:crypto.randomUUID(),title:$('title').value.trim(),amount:Number($('amount').value),type:$('type').value,date:$('date').value});e.target.reset();$('date').value=new Date().toISOString().slice(0,10);save()});$('entries').addEventListener('click',e=>{let id=e.target.dataset.del;if(id){items=items.filter(x=>x.id!==id);save()}});$('filter').addEventListener('input',render);$('export').addEventListener('click',()=>{let csv='Description,Amount,Type,Date\n'+items.map(x=>[x.title,x.amount,x.type,x.date].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='khata-lite.csv';a.click();URL.revokeObjectURL(a.href)});render();
</script></body></html>
