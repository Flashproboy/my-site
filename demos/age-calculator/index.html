<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f0fdf4);font:16px system-ui,Arial;color:#13243a}.card{width:min(100%,560px);background:white;padding:30px;border-radius:24px;box-shadow:0 20px 60px #1232}.pill{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:30px;padding:6px 12px;font-size:.8rem;font-weight:700}h1{font-size:2.2rem;margin:14px 0 8px}p{color:#64748b;line-height:1.6}label{display:block;margin:22px 0 7px;font-weight:650}input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #cbd5e1;font:inherit}button{margin-top:14px;background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer}.result{display:none;margin-top:20px;padding:18px;background:#eff6ff;border-radius:16px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.num{background:white;border-radius:12px;padding:12px;text-align:center}.num strong{display:block;font-size:1.5rem;color:#1d4ed8}.num small{color:#64748b}@media(max-width:420px){.card{padding:22px}.numbers{gap:6px}.num{padding:8px}.num strong{font-size:1.2rem}}
</style></head><body><main class="card"><span class="pill">FREE MINI TOOL</span><h1>Age Calculator</h1><p>Calculate your exact age in years, months and days, plus the time until your next birthday. Your date stays in this browser.</p><label for="dob">Date of birth</label><input type="date" id="dob"><button id="calc">Calculate my age</button><section class="result" id="result" aria-live="polite"><h2 id="summary"></h2><div class="numbers"><div class="num"><strong id="years">0</strong><small>Years</small></div><div class="num"><strong id="months">0</strong><small>Months</small></div><div class="num"><strong id="days">0</strong><small>Days</small></div></div><p id="birthday"></p></section></main><script>
const $=id=>document.getElementById(id),today=new Date();$('dob').max=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');function addMonths(date,months){let d=new Date(date),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d}function calculate(){let raw=$('dob').value;if(!raw){alert('Please select your date of birth.');return}let birth=new Date(raw+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);if(birth>now){alert('Date of birth cannot be in the future.');return}let y=now.getFullYear()-birth.getFullYear(),anniv=new Date(now.getFullYear(),birth.getMonth(),birth.getDate());if(anniv>now)y--;let cursor=new Date(birth);cursor.setFullYear(cursor.getFullYear()+y);let m=0;while(addMonths(cursor,m+1)<=now)m++;cursor=addMonths(cursor,m);let d=Math.floor((now-cursor)/86400000);$('years').textContent=y;$('months').textContent=m;$('days').textContent=d;$('summary').textContent='Your age today';let next=new Date(now.getFullYear(),birth.getMonth(),birth.getDate());if(next<=now)next=new Date(now.getFullYear()+1,birth.getMonth(),birth.getDate());let daysLeft=Math.ceil((next-now)/86400000);$('birthday').textContent=daysLeft===0?'Happy birthday!':daysLeft+' day(s) until your next birthday.';$('result').style.display='block'}$('calc').addEventListener('click',calculate);
</script></body></html>
