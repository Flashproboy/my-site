<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Note</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ff;color:#262342;font:16px system-ui,Arial;padding:24px}.app{max-width:900px;margin:auto}.top{background:#4f46e5;color:white;padding:25px;border-radius:20px}.top h1{margin:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{background:#fff;border:1px solid #e5e1ff;border-radius:16px;padding:16px}input,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #d6d3e8;border-radius:10px;margin-top:8px}textarea{min-height:180px;resize:vertical}button{background:#4f46e5;color:white;border:0;font-weight:700;cursor:pointer}.note{padding:12px;border:1px solid #e9e7f5;border-radius:12px;margin-top:10px;cursor:pointer}.note.active{border-color:#4f46e5;background:#f5f3ff}.note p{white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:.8rem;color:#777}.bar{display:flex;gap:8px}.bar button{flex:1}.bar .del{background:#b91c1c}.empty{color:#777}@media(max-width:650px){body{padding:12px}.layout{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><h1>Quick Note</h1><p>Capture ideas, search notes, and keep them saved in this browser.</p></header><div class="layout"><section class="panel"><h2>Your notes</h2><input id="search" placeholder="Search title or content"><button id="new">＋ New note</button><div id="list"></div></section><section class="panel"><h2 id="heading">Create a note</h2><input id="title" maxlength="100" placeholder="Note title"><textarea id="body" placeholder="Write your note here…"></textarea><div class="bar"><button id="save">Save note</button><button class="del" id="delete">Delete</button></div><p class="meta">Notes are stored locally in this browser. Export or back up important content separately.</p></section></div></main><script>
const $=id=>document.getElementById(id);let notes=JSON.parse(localStorage.getItem('quick-note-data')||'[]'),selected=null;function persist(){localStorage.setItem('quick-note-data',JSON.stringify(notes));render()}function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function reset(){selected=null;$('heading').textContent='Create a note';$('title').value='';$('body').value='';render()}function render(){let q=$('search').value.toLowerCase(),list=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);$('list').innerHTML=list.length?list.map(n=>'<article class="note '+(n.id===selected?'active':'')+'" data-id="'+n.id+'"><b>'+escape(n.title||'Untitled')+'</b><p>'+escape(n.body.slice(0,110))+'</p><div class="meta">Updated '+new Date(n.updated).toLocaleString()+'</div></article>').join(''):'<p class="empty">No notes found. Create one to get started.</p>'}function openNote(n){selected=n.id;$('heading').textContent='Edit note';$('title').value=n.title;$('body').value=n.body;render()}$('new').onclick=reset;$('search').oninput=render;$('list').onclick=e=>{let el=e.target.closest('[data-id]');if(el){let n=notes.find(x=>x.id===el.dataset.id);if(n)openNote(n)}};$('save').onclick=()=>{let title=$('title').value.trim(),body=$('body').value.trim();if(!title&&!body){alert('Add a title or some note text first.');return}let now=Date.now();if(selected){let n=notes.find(x=>x.id===selected);if(n)Object.assign(n,{title,body,updated:now})}else{let n={id:crypto.randomUUID(),title,body,updated:now};notes.push(n);selected=n.id}$('heading').textContent='Edit note';persist()};$('delete').onclick=()=>{if(!selected){reset();return}notes=notes.filter(n=>n.id!==selected);persist();reset()};render();
</script></body></html>
